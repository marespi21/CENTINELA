name: Contenedores (API + worker + consola)

# Construye y publica en GHCR las tres imágenes del sistema: la API de ingesta,
# el motor de scoring y la consola del analista.
#
# Credenciales: NINGUNA almacenada. La autenticación contra GHCR usa el
# GITHUB_TOKEN que Actions emite para esta ejecución y caduca al terminar; no
# hay ningún PAT en `secrets` del repositorio para publicar.

on:
  push:
    branches: ["main", "develop", "fix/**", "feature/**"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/containers.yml"
      - "infra/verify-image-secrets.sh"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/containers.yml"
      - "infra/verify-image-secrets.sh"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # Las pruebas son puerta de entrada: no se publica una imagen que no pasa.
  test:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        working-directory: backend
        run: python -m pytest tests -q

  build:
    name: Imagen ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: backend/Dockerfile.api
            context: backend
          - component: worker
            dockerfile: backend/Dockerfile.worker
            context: backend
          # La consola vive en otro arbol y tiene su propio Dockerfile, asi que
          # el contexto de build no puede ser el mismo que el del backend.
          - component: console
            dockerfile: frontend/Dockerfile
            context: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Metadatos y etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/centinela-${{ matrix.component }}
          # `sha-<corto>` es la etiqueta inmutable con la que despliega
          # containerapps.sh: `latest` puede moverse bajo los pies de una
          # revisión ya desplegada, un sha no.
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # Se construye SOLO para linux/amd64: es la arquitectura de Container Apps.
      # Añadir arm64 duplicaría el tiempo de CI sin que nadie consuma esa imagen.
      - name: Construir (carga local para auditar antes de publicar)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: centinela-${{ matrix.component }}:audit
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # Puerta de bloqueo: si la imagen lleva un secreto, corre como root o
      # conserva pip, el job falla y NO se publica nada.
      - name: Auditar la imagen (secretos y endurecimiento)
        run: bash infra/verify-image-secrets.sh --self-test centinela-${{ matrix.component }}:audit

      - name: Informar el tamaño de la imagen
        run: |
          BYTES=$(docker image inspect centinela-${{ matrix.component }}:audit --format '{{.Size}}')
          FS=$(docker run --rm --user 0 --entrypoint sh centinela-${{ matrix.component }}:audit \
                 -c 'du -sxm / 2>/dev/null | cut -f1')
          {
            echo "### Imagen \`centinela-${{ matrix.component }}\`"
            echo ""
            echo "| Medida | Valor |"
            echo "| --- | --- |"
            echo "| Descargable (comprimida) | $((BYTES / 1048576)) MiB |"
            echo "| En disco (descomprimida) | ${FS} MiB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Autenticarse en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reconstruir es instantáneo: sale entero de la caché del paso anterior.
      - name: Publicar en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
