services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    env_file:
      - .env
    depends_on:
      - azurite

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    # --skipApiVersionCheck: the azure-storage SDKs in requirements.txt default
    # to API version 2026-06-06, newer than this Azurite image supports. The
    # flag is emulator-only (local) and never affects real Azure.
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:
